<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Studio — Free QR Code Generator</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bg: '#F7F8FA',
                        card: '#FFFFFF',
                        primary: '#2563EB',
                        success: '#16A34A',
                        error: '#DC2626',
                        dark: { bg: '#0B0D10', card: '#15181D', border: '#272B33' }
                    },
                    boxShadow: { 'soft': '0 4px 24px -4px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>
    
    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- QR Code Styling Library -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.2s, color 0.2s; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #E5E7EB; }
        .dark .glass-header { background: rgba(11, 13, 16, 0.85); border-bottom: 1px solid #272B33; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .toast-enter { animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 100%); } to { opacity: 1; transform: translate(-50%, 0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-bg text-gray-900 dark:bg-dark-bg dark:text-gray-100 antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Utility Functions ---
        const isValidUrl = (string) => {
            try { new URL(string); return true; } catch (_) { return false; }
        };
        
        const normalizeUrl = (string) => {
            if (!string) return '';
            if (!/^https?:\/\//i.test(string)) return 'https://' + string;
            return string;
        };

        const getLuminance = (hex) => {
            let rgb = (hex || '#000000').replace('#', '').match(/\w\w/g)?.map(x => parseInt(x, 16)/255) || [0,0,0];
            let [r, g, b] = rgb.map(x => x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4));
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        };

        const isContrastLow = (fg, bg) => {
            let lum1 = getLuminance(fg), lum2 = getLuminance(bg);
            let ratio = (Math.max(lum1, lum2) + 0.05) / (Math.min(lum1, lum2) + 0.05);
            return ratio < 2.5; 
        };

        const formatFilename = (url) => {
            try { return `qr-studio-${new URL(url).hostname.replace('www.', '')}`; } 
            catch { return `qr-studio-${Date.now()}`; }
        };

        // --- Logo Shape Processor ---
        const processLogoShape = (dataUrl, shape) => {
            return new Promise((resolve) => {
                if (shape === 'square') { resolve(dataUrl); return; }
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const size = Math.min(img.width, img.height);
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.beginPath();
                    if (shape === 'circle') {
                        ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
                    } else if (shape === 'rounded') {
                        const r = size * 0.2; // 20% border radius
                        ctx.moveTo(r, 0); ctx.arcTo(size, 0, size, size, r);
                        ctx.arcTo(size, size, 0, size, r); ctx.arcTo(0, size, 0, 0, r);
                        ctx.arcTo(0, 0, size, 0, r); ctx.closePath();
                    }
                    ctx.clip();
                    const dx = (size - img.width) / 2;
                    const dy = (size - img.height) / 2;
                    ctx.drawImage(img, dx, dy);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = dataUrl;
            });
        };

        // --- Icons Component ---
        const Icon = ({ name, size=20, className="" }) => {
            const icons = {
                link: <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>,
                upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
                check: <path d="M20 6L9 17l-5-5"/>,
                copy: <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>,
                moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
                sun: <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>,
                trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                qr: <rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect>,
                warn: <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/>,
                menu: <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>,
                close: <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>,
                chevron: <polyline points="6 9 12 15 18 9"></polyline>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // --- FAQ Accordion Component ---
        const Accordion = ({ title, content }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border border-gray-200 dark:border-dark-border rounded-xl overflow-hidden mb-3 bg-white dark:bg-dark-card transition-all">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full text-left px-5 py-4 flex justify-between items-center focus:outline-none">
                        <span className="font-semibold text-sm text-gray-900 dark:text-white">{title}</span>
                        <Icon name="chevron" size={16} className={`transform transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    {isOpen && (
                        <div className="px-5 pb-4 text-sm text-gray-600 dark:text-gray-400 fade-in">
                            {content}
                        </div>
                    )}
                </div>
            );
        }

        // --- Main App Component ---
        const App = () => {
            // Theme State
            const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            
            // Core States
            const [rawUrl, setRawUrl] = useState('');
            const url = normalizeUrl(rawUrl);
            const isValid = rawUrl.length > 0 ? isValidUrl(url) : false;

            const [logo, setLogo] = useState(null);
            const [logoFile, setLogoFile] = useState(null);
            const [processedLogo, setProcessedLogo] = useState(null);
            
            // Customization States
            const [logoSize, setLogoSize] = useState(0.2); // 10% - 30%
            const [logoShape, setLogoShape] = useState('rounded'); 
            const [qrColor, setQrColor] = useState('#111111');
            const [bgColor, setBgColor] = useState('#FFFFFF');
            const [moduleStyle, setModuleStyle] = useState('square'); 
            const [finderStyle, setFinderStyle] = useState('square'); 
            const [exportSize, setExportSize] = useState(1024);
            
            const [toast, setToast] = useState('');
            const [toastType, setToastType] = useState('success'); // success, error
            const [isGenerating, setIsGenerating] = useState(false);
            
            const qrRef = useRef(null);
            const qrCodeInstance = useRef(null);

            // Theme Effect
            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [theme]);

            const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');
            
            const showToast = (msg, type = 'success') => { 
                setToast(msg); 
                setToastType(type);
                setTimeout(() => setToast(''), 3000); 
            };

            // Process Logo Shape
            useEffect(() => {
                if (logo) {
                    processLogoShape(logo, logoShape).then(setProcessedLogo);
                } else {
                    setProcessedLogo(null);
                }
            }, [logo, logoShape]);

            // Initialize & Update QR Code natively
            useEffect(() => {
                if (!qrCodeInstance.current) {
                    qrCodeInstance.current = new QRCodeStyling({
                        width: 320, 
                        height: 320, 
                        margin: 16, // Quiet zone (~4 modules)
                        type: 'svg',
                        qrOptions: { errorCorrectionLevel: 'H' } // Mandatory Level H
                    });
                }
                
                qrCodeInstance.current.update({
                    data: isValid ? url : 'https://qrstudio.com',
                    image: processedLogo || undefined,
                    dotsOptions: { color: qrColor, type: moduleStyle },
                    backgroundOptions: { color: bgColor },
                    cornersSquareOptions: { color: qrColor, type: finderStyle === 'rounded' ? 'extra-rounded' : 'square' },
                    cornersDotOptions: { color: qrColor, type: finderStyle === 'rounded' ? 'dot' : 'square' },
                    imageOptions: { 
                        crossOrigin: "anonymous",
                        margin: 6, // White padding around logo
                        imageSize: logoSize,
                        hideBackgroundDots: true // Ensures scanability by removing dots behind logo
                    }
                });

                if (qrRef.current) {
                    qrRef.current.innerHTML = '';
                    qrCodeInstance.current.append(qrRef.current);
                }
            }, [url, isValid, processedLogo, logoSize, qrColor, bgColor, moduleStyle, finderStyle]);

            // Handlers
            const handlePaste = async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    setRawUrl(text);
                } catch (e) { showToast('Clipboard access denied or unavailable.', 'error'); }
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                // Validate size (5MB max)
                if (file.size > 5 * 1024 * 1024) { 
                    showToast('File is too large. Maximum size is 5 MB.', 'error'); 
                    return; 
                }
                // Validate format
                if (!['image/png', 'image/jpeg', 'image/jpg', 'image/svg+xml'].includes(file.type)) { 
                    showToast('Unsupported file format.', 'error'); 
                    return; 
                }
                
                setLogoFile(file);
                const reader = new FileReader();
                reader.onload = (event) => setLogo(event.target.result);
                reader.onerror = () => showToast('Unable to load logo.', 'error');
                reader.readAsDataURL(file);
            };

            const removeLogo = () => { 
                setLogo(null); 
                setLogoFile(null); 
                setProcessedLogo(null); 
                setLogoSize(0.2);
            };

            const handleReset = () => {
                setRawUrl(''); removeLogo(); setLogoShape('rounded');
                setQrColor('#111111'); setBgColor('#FFFFFF'); 
                setModuleStyle('square'); setFinderStyle('square');
                setExportSize(1024);
                showToast('Settings reset to default.');
            };

            const handleDownload = async (ext) => {
                if (!isValid) { showToast('Please enter a valid URL first.', 'error'); return; }
                setIsGenerating(true);
                
                try {
                    // Create a temporary instance for high-res download
                    const dlInstance = new QRCodeStyling({
                        width: exportSize, 
                        height: exportSize, 
                        margin: Math.floor(exportSize * 0.05), // proportionate quiet zone
                        data: url,
                        image: processedLogo || undefined,
                        qrOptions: { errorCorrectionLevel: 'H' },
                        dotsOptions: { color: qrColor, type: moduleStyle },
                        backgroundOptions: { color: bgColor },
                        cornersSquareOptions: { color: qrColor, type: finderStyle === 'rounded' ? 'extra-rounded' : 'square' },
                        cornersDotOptions: { color: qrColor, type: finderStyle === 'rounded' ? 'dot' : 'square' },
                        imageOptions: { crossOrigin: "anonymous", margin: Math.floor(exportSize * 0.02), imageSize: logoSize, hideBackgroundDots: true }
                    });

                    await dlInstance.download({ name: formatFilename(url), extension: ext });
                    showToast('QR Code downloaded successfully.');
                } catch (err) {
                    showToast('Something went wrong. Please try again.', 'error');
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleTestQR = () => {
                if (isValid) {
                    window.open(url, '_blank');
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Header */}
                    <header className="glass-header sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 font-bold text-xl text-gray-900 dark:text-white">
                                <div className="text-primary"><Icon name="qr" size={26}/></div>
                                QR Studio
                            </div>
                            
                            {/* Desktop Nav */}
                            <nav className="hidden md:flex gap-8 text-sm font-medium text-gray-600 dark:text-gray-300">
                                <a href="#generator" className="hover:text-primary transition">Generator</a>
                                <a href="#features" className="hover:text-primary transition">Features</a>
                                <a href="#faq" className="hover:text-primary transition">FAQ</a>
                            </nav>
                            
                            <div className="hidden md:flex items-center gap-4">
                                <button onClick={toggleTheme} className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition" aria-label="Toggle Dark Mode">
                                    {theme === 'light' ? <Icon name="moon" /> : <Icon name="sun" />}
                                </button>
                            </div>

                            {/* Mobile Hamburger */}
                            <button className="md:hidden p-2 text-gray-600 dark:text-gray-300" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                                <Icon name={mobileMenuOpen ? "close" : "menu"} size={24} />
                            </button>
                        </div>
                        
                        {/* Mobile Menu */}
                        {mobileMenuOpen && (
                            <div className="md:hidden absolute top-16 left-0 w-full bg-white dark:bg-dark-card border-b border-gray-200 dark:border-dark-border px-4 py-4 flex flex-col gap-4 shadow-lg z-40 fade-in">
                                <a href="#generator" onClick={()=>setMobileMenuOpen(false)} className="text-sm font-medium text-gray-700 dark:text-gray-300">Generator</a>
                                <a href="#features" onClick={()=>setMobileMenuOpen(false)} className="text-sm font-medium text-gray-700 dark:text-gray-300">Features</a>
                                <a href="#faq" onClick={()=>setMobileMenuOpen(false)} className="text-sm font-medium text-gray-700 dark:text-gray-300">FAQ</a>
                                <div className="h-px bg-gray-100 dark:bg-gray-800 my-2"></div>
                                <button onClick={() => {toggleTheme(); setMobileMenuOpen(false);}} className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center gap-2">
                                    {theme === 'light' ? <Icon name="moon" size={16}/> : <Icon name="sun" size={16}/>} Toggle Theme
                                </button>
